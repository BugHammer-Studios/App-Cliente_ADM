<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b4b5e">
<title>Preciso Corte · Barbeiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <section class="login">
    <h1>Escolha o barbeiro</h1>
    <p>Selecione para ver a fila correspondente.</p>
    <div class="cards2">
      <a class="pcard" href="fila.html?barbeiro=barbeiro1">
        <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="#pessoa"/></svg>
        <div class="ptxt"><strong>Barbeiro 1</strong><span>Fila do Barbeiro 1 + fila geral</span></div>
        <span class="seta" aria-hidden="true">›</span>
      </a>
      <a class="pcard" href="fila.html?barbeiro=barbeiro2">
        <svg class="avatar" viewBox="0 0 40 40" aria-hidden="true"><use href="#pessoa"/></svg>
        <div class="ptxt"><strong>Barbeiro 2</strong><span>Fila do Barbeiro 2 + fila geral</span></div>
        <span class="seta" aria-hidden="true">›</span>
      </a>
    </div>
    <button class="btn-sair" id="btnSair" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </button>
  </section>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="pessoa" viewBox="0 0 40 40">
      <circle cx="20" cy="12" r="8" fill="#2f2f45"/>
      <path d="M3 38c0-9.6 7.6-15 17-15s17 5.4 17 15z" fill="#2f2f45"/>
    </symbol>
  </defs>
</svg>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
