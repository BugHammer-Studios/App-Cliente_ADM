<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b4b5e">
<title>Preciso Corte · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <section class="login">
    <div class="topbar"><div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#tesoura"/></svg>Preciso Corte</div></div>
    <h1>Entrar</h1>
    <p>Acesso do administrador da barbearia.</p>
    <form id="formLogin" novalidate>
      <label class="campo"><span>E-mail</span><input id="email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="campo"><span>Senha</span><input id="senha" type="password" autocomplete="current-password"></label>
      <button class="entrar" id="btnEntrar" type="submit">Entrar</button>
      <div class="erro" id="erroLogin" role="alert"></div>
      <div class="demo-note" id="demoNote" hidden>Modo demo: qualquer e-mail e senha entram.</div>
    </form>
  </section>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tesoura" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <circle cx="9" cy="27" r="4.5"/><circle cx="19" cy="33" r="4.5"/>
      <path d="M12 23.5 L33 5"/><path d="M16 29.5 L22 20 L33 33"/>
    </symbol>
  </defs>
</svg>

<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/login.js"></script>
</body>
</html>
